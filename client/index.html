<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylogger</title>
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.1.0/styles/ag-grid.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.1.0/styles/ag-theme-alpine.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="recording-indicator">
            <div class="dot"><img src="sorce/svg/recording animation.svg" alt=""></div>
            <span>Recording...</span>
            <span id="timer">00:00</span>
        </div>
    </header>
    <main>
        <div class="container">
            <h1 class="title">keylogger</h1>
            <button id="toggleKeylogger" onclick="toggleKeylogger()">Start</button>
            <div id="myGrid" class="ag-theme-alpine"></div>
        </div>
    </main>
    <footer>
        <div>
            <p class="footerP">This system is monitored. Unauthorized use is strictly prohibited</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.1.0/dist/ag-grid-community.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
