<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylogger | Advanced Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.1.0/styles/ag-grid.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.1.0/styles/ag-theme-alpine.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="matrix-bg" id="matrixCanvas"></div>

    <header>
        <div class="logo-container">
            <div class="MnagerDetails">
                <div class="popup-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
                <button id="managerName">
                    <div class="popup-header">
                        <div class="popup-user-info">
                            <div class="popup-username" id="popupUsername">Admin</div>
                            <!-- <div class="popup-role">System Manager</div> -->
                        </div>
                    </div>
                </button>
                <div class="popup">
                    <div class="popup-actions">
                        <button class="popup-action-btn" id="editProfileBtn">
                            <i class="fas fa-user-edit"></i>
                            Edit Profile
                        </button>
                        <button class="popup-action-btn" id="addUserBtn">
                            <i class="fas fa-user-plus"></i>
                            Add New User
                        </button>
                        <button class="popup-action-btn logout-btn" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i>
                            Log Out
                        </button>
                    </div>
                </div>
                <i class="fas fa-eye surveillance-icon"></i>
            </div>
        </div>
        <div class="title-container">
            <h1 class="title">KEYLOGGER</h1>
            <p class="subtitle">ADVANCED KEYSTROKE MONITORING SYSTEM v2.5</p>
        </div>
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text">ACTIVE</span>
        </div>
    </header>

    <main>
        <div class="controls">
            <div class="users-section">
                <h3 class="section-title"><i class="fas fa-users"></i> TARGET SELECTION</h3>
                <h2 id="user" class="current-user">Initializing...</h2>
                <select id="userSelect">
                    <option value="">Select User</option>
                </select>
            </div>

            <div class="log-section">
                <h3 class="section-title"><i class="fas fa-stream"></i> LIVE FEED</h3>
                <textarea id="chooseLog" readonly placeholder="Waiting for keystrokes..."></textarea>
            </div>

            <div class="action-section">
                <button class="reload-btn" onclick="reload()">
                    <span class="btn-text">REFRESH DATA</span>
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button class="export-btn" onclick="exportData()">
                    <span class="btn-text">EXPORT</span>
                    <i class="fas fa-file-export"></i>
                </button>
            </div>
        </div>

        <div class="data-section">
            <h3 class="section-title"><i class="fas fa-table"></i> KEYSTROKE DATABASE</h3>
            <div class="container">
                <div id="myGrid" class="ag-theme-alpine"></div>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <i class="fas fa-keyboard"></i>
                <div class="stat-value" id="keystrokeCount">0</div>
                <div class="stat-label">TOTAL KEYSTROKES</div>
            </div>

            <div class="stat-card">
                <i class="fas fa-user-secret"></i>
                <div class="stat-value" id="activeUsers">0</div>
                <div class="stat-label">ACTIVE USERS</div>
            </div>

            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <div class="stat-value" id="sessionTime">0m</div>
                <div class="stat-label">SESSION TIME</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
            </div>
            <p class="footer-text">SYSTEM MONITORED | UNAUTHORIZED ACCESS PROHIBITED | Haim Assraf |<span
                    id="current-date"></span></p>
        </div>
    </footer>
    <div class="modal" id="editProfileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <span class="close-btn" onclick="closeModal('editProfileModal')">&times;</span>
            </div>
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="editUsername">Username:</label>
                    <input type="text" id="editUsername" name="user_name" required>
                </div>
                <div class="form-group">
                    <label for="editEmail">Email:</label>
                    <input type="email" id="editEmail" name="email">
                </div>
                <div class="form-group">
                    <label for="editPassword">Password (optional):</label>
                    <input type="password" id="editPassword" name="password">
                </div>
                <button type="submit" class="submit-btn">Save Changes</button>
            </form>
        </div>
    </div>

    <div class="modal" id="addUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Manager</h2>
                <span class="close-btn" onclick="closeModal('addUserModal')">&times;</span>
            </div>
            <form id="addUserForm">
                <div class="form-group">
                    <label for="addUsername">Username:</label>
                    <input type="text" id="addUsername" name="user_name" required>
                </div>
                <div class="form-group">
                    <label for="addEmail">Email:</label>
                    <input type="email" id="addEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label for="addPassword">Password:</label>
                    <input type="password" id="addPassword" name="password" required>
                </div>
                <button type="submit" class="submit-btn">Add Manager</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.1.0/dist/ag-grid-community.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
