<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylogger | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    
    <div class="login-container">
        <div class="login-card">
            <div class="encryption-badge">
                <i class="fas fa-lock"></i> SECURED
            </div>
            
            <div class="login-header">
                <i class="fas fa-eye login-icon"></i>
                <h1 class="login-title">KEYLOGGER</h1>
                <p class="login-subtitle">SYSTEM ACCESS TERMINAL</p>
            </div>
            
            <form class="login-form">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-control" id="username" placeholder="USERNAME" required>
                </div>
                
                <div class="form-group">
                    <i class="fas fa-key"></i>
                    <input type="password" class="form-control" id="password" placeholder="PASSWORD" required>
                </div>
                
                <button type="submit" class="login-btn">Authenticate</button>
                
                <div class="status-bar">
                    <div>
                        <span class="status-dot"></span>
                        SYSTEM ACTIVE
                    </div>
                    <div id="current-date">2025-02-26</div>
                </div>
                
                <div style="text-align: center;">
                    <a href="#" class="reset-link">RESET CREDENTIALS</a>
                </div>
            </form>
        </div>
    </div>
    
    <footer>
        UNAUTHORIZED ACCESS PROHIBITED | ALL ACTIVITIES LOGGED
    </footer>
    
   <script src="login.js"></script>
</body>
</html>
